[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twilio-whatsapp-llm-demo"
version = "0.1.0"
description = "WhatsApp chatbot via Twilio webhooks with a LangChain agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "langchain>=1.3.1",
    "langchain-anthropic>=1.4.3",
    "ngrok>=1.7.0",
    "twilio>=9.10.9",
]

[project.scripts]
twilio-whatsapp-llm = "twilio_whatsapp_llm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twilio_whatsapp_llm"]
